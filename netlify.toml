[build]
  publish = "dist"
  ignore = "true"

# SPA Fallback for client-side routing & quiz codes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimal caching and security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
