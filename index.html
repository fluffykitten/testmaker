<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Official examination and assessment platform for Insan Cendekia Madani, Cambridge International School. Build standardized exams, analyze past papers, and execute secure proctored tests." />
    <meta name="theme-color" content="#1e40af" />
    <title>ICM Exam Platform • Cambridge International School</title>
    <script>
      (function() {
        // Fast OAuth token receiver for Google direct popup flow (bypasses ad-blockers)
        try {
          if (window.opener && window.location.hash) {
            var hash = window.location.hash.substring(1);
            if (hash.indexOf('access_token=') !== -1) {
              var params = new URLSearchParams(hash);
              var token = params.get('access_token');
              var expiresIn = params.get('expires_in') || '3599';
              if (token) {
                window.opener.postMessage({
                  type: 'GOOGLE_OAUTH_TOKEN_SUCCESS',
                  accessToken: token,
                  expiresIn: parseInt(expiresIn, 10)
                }, window.location.origin);
                window.close();
                return;
              }
            } else if (hash.indexOf('error=') !== -1) {
              var errParams = new URLSearchParams(hash);
              var errMsg = errParams.get('error') || 'Google sign-in was denied';
              window.opener.postMessage({
                type: 'GOOGLE_OAUTH_TOKEN_ERROR',
                error: errMsg
              }, window.location.origin);
              window.close();
              return;
            }
          }
        } catch(e) {}

        try {
          var raw = localStorage.getItem('testmaker_user_settings');
          var settings = raw ? JSON.parse(raw) : null;
          var theme = settings && settings.theme ? settings.theme : 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Identity Services SDK (Preloaded for Google Forms 1-Click Export & Google Drive Backup) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
